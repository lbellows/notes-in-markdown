name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux
          - os: windows-latest
            target: win
          - os: macos-latest
            target: mac

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          npm version "$TAG_VERSION" --no-git-tag-version --allow-same-version

      - name: Build renderer
        run: npm run build

      - name: Install bsdtar for pacman packaging
        if: ${{ matrix.target == 'linux' }}
        run: sudo apt-get update && sudo apt-get install -y libarchive-tools

      - name: Publish Linux artifacts
        if: ${{ matrix.target == 'linux' && (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch') }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder@latest --linux --publish never

      # pacman repo index, served from releases/latest/download. repo-add
      # leaves .db/.files as symlinks, so swap them for real files to upload.
      - name: Build pacman repo database
        if: ${{ matrix.target == 'linux' && (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch') }}
        run: |
          docker run --rm -v "$PWD/release:/repo" -w /repo archlinux:latest \
            bash -c 'repo-add notes-in-markdown.db.tar.gz *.pacman && chown -R '"$(id -u):$(id -g)"' /repo'
          cd release
          for db in notes-in-markdown.db notes-in-markdown.files; do
            cp --remove-destination "$(readlink "$db")" "$db"
          done

      - name: Publish Windows artifacts
        if: ${{ matrix.target == 'win' && (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch') }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder@latest --win --publish never

      - name: Publish macOS artifacts
        if: ${{ matrix.target == 'mac' && (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch') }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder@latest --mac --publish never

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v3
        with:
          files: |
            release/**/*.AppImage
            release/**/*.deb
            release/**/*.pacman
            release/notes-in-markdown.db
            release/notes-in-markdown.files
            release/**/*-win-*.exe
            release/**/*.dmg
            release/**/*-mac-*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

